<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherBoard - Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        /* body { margin: 0; } */
        #map { height: 100vh; }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Plus Jakarta Sans', 'sans-serif'],
                },
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#364dff',
                            light: '#5a6eff',
                            dark: '#2b3ecc',
                            gradient: '#667aff',
                        },
                        secondary: '#798bff',
                        surface: '#F8F9FF',
                        dark: {
                            bg: '#0F172A',
                            surface: '#1E293B',
                            text: '#F1F5F9'
                        },
                        accent: {
                            green: '#10B981',
                            red: '#EF4444',
                            yellow: '#F59E0B'
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(54, 77, 255, 0.25)',
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)'
                    }
                }
            }
        }
    </script>

    <script>
        // Apply the saved dark / light mode before the page paints (no flash).
        if (localStorage.getItem("weatherboard.theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Checkbox Hack for Mobile Sidebar */
        #mobile-menu-toggle:checked ~ .sidebar-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        #mobile-menu-toggle:checked ~ .layout .sidebar {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-[#F8F9FF] text-slate-800 font-sans antialiased selection:bg-primary selection:text-white dark:bg-[#0F172A] dark:text-[#F1F5F9]">

    <!-- Mobile Menu Toggle State -->
    <input type="checkbox" id="mobile-menu-toggle" class="hidden">

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden" onclick="document.getElementById('mobile-menu-toggle').checked = false"></div>

    <!-- Layout Container -->
    <div class="layout flex min-h-screen relative overflow-hidden">

        <!-- Sidebar -->
        <aside class="sidebar fixed lg:sticky top-0 left-0 z-50 h-screen w-[280px] -translate-x-full lg:translate-x-0 transition-transform duration-300 glass flex flex-col border-r border-slate-200 dark:border-slate-800">
            <!-- Logo Area -->
            <div class="h-20 flex items-center px-8 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-3">
                    <img src="../image/logoWB.png" alt="WeatherBoard Logo" class="w-8 h-8 object-contain">
                    
                    <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">Weather<span class="text-primary font-extrabold">Board</span></span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
                <div class="px-4 mb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Main Menu</div>

                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-white hover:shadow-sm dark:hover:bg-slate-800 transition-all group">
                    <iconify-icon icon="solar:widget-add-linear" width="20" stroke-width="1.5" class="group-hover:text-primary transition-colors"></iconify-icon>
                    Dashboard
                </a>

                <a href="weatherDetail.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-white hover:shadow-sm dark:hover:bg-slate-800 transition-all group">
                    <i class="fa-solid fa-temperature-high group-hover:text-primary transition-colors"></i>
                    Weather Detail
                </a>

                <a href="forecast.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-white hover:shadow-sm dark:hover:bg-slate-800 transition-all group">
                    <iconify-icon icon="solar:cloud-linear" width="20" class="group-hover:text-primary transition-colors"></iconify-icon>
                    Forecast
                </a>

                <a href="cities.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-white hover:shadow-sm dark:hover:bg-slate-800 transition-all group">
                    <i class="fa-regular fa-building group-hover:text-primary transition-colors"></i>
                    Cities
                </a>

                <a href="map.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-medium transition-all group">
                    <i class="fa-regular fa-building group-hover:text-primary transition-colors"></i>
                    Map
                </a>

                <div class="px-4 mt-8 mb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">System</div>

                <a href="setting.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-white hover:shadow-sm dark:hover:bg-slate-800 transition-all group">
                    <iconify-icon icon="solar:settings-linear" width="20" stroke-width="1.5" class="group-hover:text-primary transition-colors"></iconify-icon>
                    Setting
                </a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="flex-1 w-full min-w-0 flex flex-col">

            <!-- Top Header -->
            <header class="h-20 glass sticky top-0 z-30 px-6 flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800/50 transition-all">
                <div class="flex items-center gap-4">
                    <!-- Mobile Menu Trigger -->
                    <label for="mobile-menu-toggle" class="lg:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
                        <iconify-icon icon="solar:hamburger-menu-linear" width="24"></iconify-icon>
                    </label>

                    <div class="hidden sm:block">
                        <h1 class="text-xl font-semibold text-slate-800 dark:text-white tracking-tight">Map</h1>
                        <div class="flex items-center gap-2 text-xs text-slate-500">
                            <span>Home</span>
                            <iconify-icon icon="solar:alt-arrow-right-linear" width="12"></iconify-icon>
                            <span class="text-primary font-medium">Map</span>
                        </div>
                    </div>
                </div>

                <!-- Dark / light mode switch -->
                <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors">
                    <iconify-icon id="theme-toggle-icon" icon="solar:moon-linear" width="22"></iconify-icon>
                </button>

            </header>

            <!-- Map Content -->
            <div id="map"></div>
        </main>
    </div>

    <!-- Our own page script (compiled from src/map/mapPage.ts) -->
    <script type="module" src="../dist/map/mapPage.js"></script>
</body>
</html>
